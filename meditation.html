<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meditation Studio | HealthAI+</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      background: linear-gradient(135deg, #1a2980 0%, #26d0ce 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { text-align: center; color: white; margin-bottom: 40px; }
    .back-btn { background: rgba(255,255,255,0.2); border: none; padding: 10px 20px; border-radius: 30px; color: white; cursor: pointer; margin-bottom: 20px; }
    .meditation-player {
      background: rgba(255,255,255,0.95);
      border-radius: 50px;
      padding: 40px;
      text-align: center;
    }
    .timer-circle {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: conic-gradient(#26d0ce 0deg, #e0e0e0 0deg);
      margin: 30px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: bold;
      color: #1a2980;
    }
    .meditation-buttons { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin: 20px 0; }
    .med-btn { background: linear-gradient(135deg, #1a2980, #26d0ce); color: white; border: none; padding: 12px 25px; border-radius: 40px; cursor: pointer; font-weight: bold; }
    .breath-guide { font-size: 1.2rem; color: #1a2980; margin-top: 20px; }
    @keyframes breathe {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
    .breathe-animation { animation: breathe 8s infinite ease-in-out; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><i class="fas fa-spa"></i> Meditation Studio</h1>
    <p>Find your calm center</p>
    <button class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i> Back to Dashboard</button>
  </div>
  <div class="meditation-player">
    <h2>🧘 Guided Breath Meditation</h2>
    <div class="timer-circle" id="timerCircle">5:00</div>
    <div class="meditation-buttons">
      <button class="med-btn" onclick="startMeditation(300)">5 min</button>
      <button class="med-btn" onclick="startMeditation(600)">10 min</button>
      <button class="med-btn" onclick="startMeditation(1200)">20 min</button>
      <button class="med-btn" onclick="stopMeditation()">Stop</button>
    </div>
    <div class="breath-guide" id="breathGuide">✨ Breathe in... breathe out... ✨</div>
  </div>
</div>
<script>
  let meditationInterval, timeLeft;
  function startMeditation(seconds) {
    if(meditationInterval) clearInterval(meditationInterval);
    timeLeft = seconds;
    updateTimerDisplay();
    meditationInterval = setInterval(() => {
      if(timeLeft <= 0) {
        clearInterval(meditationInterval);
        alert('🧘 Meditation complete! Peace be with you.');
        document.getElementById('breathGuide').innerHTML = '✨ Session complete. Carry this peace with you. ✨';
      } else {
        timeLeft--;
        updateTimerDisplay();
        // Breath guidance every 8 seconds
        if(timeLeft % 8 === 0) document.getElementById('breathGuide').innerHTML = '🌬️ Breathe in...';
        if(timeLeft % 4 === 0) document.getElementById('breathGuide').innerHTML = '🌊 Breathe out...';
      }
    }, 1000);
  }
  function updateTimerDisplay() {
    let mins = Math.floor(timeLeft / 60);
    let secs = timeLeft % 60;
    document.getElementById('timerCircle').innerHTML = `${mins}:${secs.toString().padStart(2,'0')}`;
  }
  function stopMeditation() {
    clearInterval(meditationInterval);
    document.getElementById('timerCircle').innerHTML = "5:00";
    document.getElementById('breathGuide').innerHTML = "✨ Breathe in... breathe out... ✨";
  }
</script>
</body>
</html>
