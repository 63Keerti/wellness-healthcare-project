<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Brain Games | HealthAI+</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }
    .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
    }
    .game-card {
      background: rgba(255,255,255,0.95);
      border-radius: 30px;
      padding: 25px;
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }
    .game-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .game-card i { font-size: 3rem; color: #667eea; margin-bottom: 15px; }
    .game-card h3 { font-size: 1.5rem; margin-bottom: 10px; color: #2c3e50; }
    .game-card p { color: #666; }
    .memory-game {
      background: rgba(255,255,255,0.95);
      border-radius: 30px;
      padding: 25px;
      margin-top: 30px;
      display: none;
    }
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      max-width: 500px;
      margin: 20px auto;
    }
    .memory-card {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      transition: 0.3s;
      color: white;
    }
    .memory-card.flipped { background: white; color: #667eea; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      color: white;
      cursor: pointer;
      margin-bottom: 20px;
    }
    @media (max-width: 768px) {
      .memory-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><i class="fas fa-gamepad"></i> Brain Training Games</h1>
    <p>Sharpen your mind with fun cognitive games</p>
    <button class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i> Back to Dashboard</button>
  </div>
  <div class="games-grid">
    <div class="game-card" onclick="startMemoryGame()">
      <i class="fas fa-brain"></i>
      <h3>Memory Match</h3>
      <p>Test your memory by matching pairs</p>
    </div>
    <div class="game-card" onclick="alert('Coming Soon! More games added weekly.')">
      <i class="fas fa-calculator"></i>
      <h3>Math Speed</h3>
      <p>Quick mental math challenges</p>
    </div>
    <div class="game-card" onclick="alert('Coming Soon! More games added weekly.')">
      <i class="fas fa-puzzle-piece"></i>
      <h3>Sudoku</h3>
      <p>Classic number puzzle game</p>
    </div>
  </div>
  <div id="memoryGame" class="memory-game">
    <h2 style="text-align:center; margin-bottom:20px;">🧠 Memory Match Game</h2>
    <div class="memory-grid" id="memoryGrid"></div>
    <button style="display:block; margin:20px auto; background:#667eea; color:white; border:none; padding:10px 30px; border-radius:30px;" onclick="resetMemoryGame()">New Game</button>
  </div>
</div>
<script>
  const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
  let cards = [], flippedCards = [], matchedPairs = 0, lockBoard = false;

  function startMemoryGame() {
    document.getElementById('memoryGame').style.display = 'block';
    resetMemoryGame();
  }

  function resetMemoryGame() {
    cards = [...emojis, ...emojis];
    for (let i = cards.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    flippedCards = [];
    matchedPairs = 0;
    lockBoard = false;
    renderMemoryGrid();
  }

  function renderMemoryGrid() {
    const grid = document.getElementById('memoryGrid');
    grid.innerHTML = '';
    cards.forEach((card, index) => {
      const cardDiv = document.createElement('div');
      cardDiv.className = 'memory-card';
      cardDiv.textContent = flippedCards.includes(index) || matchedPairs > cards.filter((_, i) => flippedCards.includes(i) && cards[i] === card).length / 2 ? card : '?';
      cardDiv.onclick = () => flipCard(index);
      grid.appendChild(cardDiv);
    });
  }

  function flipCard(index) {
    if (lockBoard || flippedCards.includes(index)) return;
    flippedCards.push(index);
    renderMemoryGrid();
    if (flippedCards.length === 2) {
      lockBoard = true;
      setTimeout(() => {
        if (cards[flippedCards[0]] === cards[flippedCards[1]]) {
          matchedPairs++;
          if (matchedPairs === emojis.length) alert('🎉 Congratulations! You won! 🎉');
        } else {
          flippedCards.pop();
          flippedCards.pop();
        }
        lockBoard = false;
        renderMemoryGrid();
      }, 500);
    }
  }
</script>
</body>
</html>
